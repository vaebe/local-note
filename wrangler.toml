# Cloudflare Pages 配置
# 文档：https://developers.cloudflare.com/pages/
#
# 本地预览 / 部署（通过 pnpm dlx，避免 npm/npx 触发 EBADDEVENGINES）：
#   pnpm run pages:dev
#   pnpm run pages:deploy
#
# Cloudflare 控制台建议：
#   Build command  : pnpm install --frozen-lockfile && pnpm run build
#   Deploy command : pnpm run cf:deploy
#   Build output   : dist
#   Node.js        : 22 或 24
#
# 失败原因说明：
#   不要用 `npx wrangler deploy`。本仓库 devEngines 要求 packageManager=pnpm，
#   npm/npx 会报 EBADDEVENGINES。应使用 `pnpm run cf:deploy`（内部为 pages deploy）。
#   若使用 Pages「仅上传构建产物」模式，可清空 Deploy command。

name = "local-note"
compatibility_date = "2026-08-06"

# Pages 静态产物目录（与 Vite 的 outDir 一致）
pages_build_output_dir = "dist"
